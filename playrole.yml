- hosts: old, new
  become: true
  tasks:
    - name: Ставим git через роль
      ansible.builtin.import_role:
        name: geerlingguy.git
    - name: Ставим postgres через роль
      ansible.builtin.import_role:
        name: geerlingguy.postgresql
    - name: Действия после роли postgres
      ansible.builtin.service:
        name: postgresql
        state: started
    - name: Удалить конфликтующий libnode-dev перед установкой Node.js
      ansible.builtin.apt:
        name:
          - libnode-dev
          - libnode72
        state: absent
        purge: yes
      when: ansible_os_family == "Debian"
      tags:
        nodejs
    - name: Ставим nodejs через роль
      ansible.builtin.import_role:
        name: geerlingguy.nodejs
      vars: 
        nodejs_version: '18.x'
      tags:
        nodejs