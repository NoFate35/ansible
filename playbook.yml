- hosts: app
  tasks: 
  - name: install redis server
    # apt-get update && apt-get install redis-server
    ansible.builtin.apt: # имя модуля Ansible
     name: redis-server
     state: present
     update_cache: true
    become: true

  - name: remove redis server
    ansible.builtin.apt:                     # apt-get remove redis-server                 ansible.builtin.apt:
     name: redis-server
     state: absent
    become: true
