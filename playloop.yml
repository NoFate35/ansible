- hosts: all
  gather_facts: false
  vars:
    users:
      - {name: jaimie}
      - {name: sansa}
      - {name: robert}
  tasks:
    - name: install packages
      ansible.builtin.apt:
        name:
          '{{ item }}'
        state: latest
      loop:
        - redis-server
        - postgresql
      become: true

    - name: add test users
      ansible.builtin.user:
        name: "{{ item.name }}"
        state: present
      loop: '{{ users }}'
      become: true

    - name: add git config
      ansible.builtin.template:
        src: files/gitconfig
        dest: /home/{{ item.name }}/.gitconfig
      loop: '{{ users }}'
      become: true

    - name: create directory
      ansible.builtin.file:
        path: /home/{{ item.name }}/.ssh
        state: directory
      loop: '{{ users }}'
      become: true

    - name: add ssh
      ansible.builtin.copy:
        src: files/fakessh
        dest: /home/{{ item.name }}/.ssh/authorized_keys
      loop: '{{ users }}'
      become: true

    - name: remove test users
      ansible.builtin.user:
        name: "{{ item.name }}"
        state: absent
        remove: yes
      loop: '{{ users }}'
      become: true